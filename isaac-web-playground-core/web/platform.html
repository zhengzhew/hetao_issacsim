<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小芽 · 体验台管理</title>
<style>body{margin:0;background:#e8f5ee;color:#28483d;font:17px/1.6 system-ui}main{max-width:1080px;margin:auto;padding:28px}h1{margin-bottom:0}small{color:#5b7d6d}section,article{background:white;padding:24px;border-radius:24px;margin:20px 0}label{display:block;margin-top:16px}input,select{box-sizing:border-box;width:100%;padding:14px;border:1px solid #b9d8c7;border-radius:12px;font:inherit}button,a.button{display:inline-block;padding:14px 22px;border:0;border-radius:14px;background:#409d70;color:white;font:inherit;font-weight:700;margin:14px 12px 0 0;cursor:pointer;text-decoration:none}button.secondary{background:#e8f5ee;color:#28483d}button:disabled{opacity:.5;cursor:wait}#notice{padding:12px;white-space:pre-wrap;color:#8a3c2b}code{font-size:22px;background:#fff2c9;padding:8px;word-break:break-all}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;background:#eef5f0;padding:12px}#login{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}dt{font-weight:bold}dd{margin:0 0 10px}.muted{color:#63816e} [hidden]{display:none!important}</style>
<main><h1>小芽 · 体验台管理</h1><small>基于 NVIDIA 英伟达 · Isaac Sim</small><p id="notice" role="status"></p>
<div id="login"><section><h2>老师登录</h2><form id="teacherForm"><label>老师密码<input id="password" type="password" required autocomplete="current-password"></label><button>登录管理</button></form><small>首次密码保存在服务器 run/platform/teacher-password.txt。</small></section>
<section><h2>连接体验台</h2><form id="pairForm"><label>老师提供的浏览器配对码<input id="code" required autocomplete="off"></label><button>进入体验</button></form><p id="connectorHelp">机械臂插在另一台电脑时，在那台电脑运行连接工具并选择该臂的校准文件。</p><a class="button" href="/downloads/so101-leader-windows.zip">下载 Windows 连接工具</a></section></div>
<section id="manage" hidden><h2>活动与设备</h2><label>体验台<select id="stations"></select></label><button id="browserCode">生成浏览器配对码</button><button id="deviceCode">生成采集器配对码</button><button id="openGame" class="secondary">在此电脑打开体验</button><p id="pairResult"></p><button id="refresh" class="secondary">刷新诊断</button><button id="export" class="secondary">导出诊断记录</button><button id="logout" class="secondary">退出管理</button><p class="muted">每个原生视频实例只连接一个体验浏览器。更换浏览器前，请解除旧配对。</p><div id="diagnostics"></div><h3>已配对设备</h3><div id="clients"></div><h3>机械臂与校准文件</h3><p class="muted">新版连接器自动按校准文件生成配置编号，不需要手填编号。每台实物臂选择自己的配置文件；配置编号不等于实物身份。</p><div id="arms"></div></section></main><script type="module" src="/platform-ui.js"></script></html>
