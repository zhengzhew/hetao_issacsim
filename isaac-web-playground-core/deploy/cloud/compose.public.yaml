services:
  edge:
    image: ${CADDY_IMAGE:-caddy:2.11.7}
    network_mode: host
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${DEPLOY_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEPLOY_DIR}/edge/data:/data
      - ${DEPLOY_DIR}/edge/config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      gateway:
        condition: service_healthy
